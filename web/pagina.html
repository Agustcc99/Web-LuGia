<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--cabecera-->
    <meta name="theme-color" content="#7a1f3d" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      /* Alto de la barra de arriba desde el primer momento, para que el contenido no salte al cargar. */
      :root { --alto-header: 68px; }
      @media (min-width: 48rem) { :root { --alto-header: 84px; } }
    </style>
  </head>

    <div id="root" data-pagina=""><!--contenido--></div>
